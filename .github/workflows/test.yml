name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}
  # Installed copies of the app update yt-dlp on their own, so a yt-dlp release
  # that renames an option breaks them without any change on our side. A weekly
  # run against the newest yt-dlp notices before users do.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install --upgrade -e ".[gui,test]"

      - name: Run tests
        run: pytest -v
